/* Missões 2 e 3 */
.missiontiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.missiontile{background:linear-gradient(145deg,#49335f,#2b203e);border:2px solid #9477a8;border-radius:18px;color:var(--ink);min-height:190px;padding:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;text-align:center}.missiontile strong{font-size:1.25rem;color:var(--gold)}.missiontile span:not(.missionicon){font-weight:700}.missiontile small{font-size:.77rem}.missionicon{font-size:2.6rem}.potion-art{text-align:center;font-size:3rem;background:#20152f;border:1px solid #705484;border-radius:15px;padding:17px}.draw-slots{display:flex;align-items:center;justify-content:center;gap:16px}.draw-slot{width:72px;height:72px;display:flex;align-items:center;justify-content:center;border:2px solid #a78bb8;border-radius:16px;background:#1a1327;font-size:2.4rem;font-weight:800}.slotplus{font-size:1.8rem;color:var(--gold)}.comparison{display:grid;grid-template-columns:1fr 1fr;gap:10px}.comparison>div{display:grid;gap:5px;background:#1b1429;border:1px solid #725782;border-radius:12px;padding:13px;text-align:center}.comparison strong{font-size:1.5rem;color:var(--gold)}.formula{font-size:1.4rem;font-weight:850;color:var(--gold)}@media(max-width:430px){.missiontiles{grid-template-columns:1fr}.missiontile{min-height:130px}.draw-slot{width:62px;height:62px}}

/* Missão 4 */
.strategy-results{display:grid;gap:9px}.strategy-result{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:9px;background:#1b1429;border:1px solid #725782;border-radius:12px;padding:12px}.strategy-result.best{border:2px solid #6ce6b7;background:#193b36}.strategy-result small{display:block;font-size:.72rem}.strategy-result>strong{color:var(--gold)}.strategy-math{font-size:.85rem}.strategyjar .counts strong{color:#ffe6a4}@media(max-width:430px){.strategy-result{grid-template-columns:1fr auto}.strategy-math{grid-column:1/-1;grid-row:2}.strategy-result>strong{grid-column:2;grid-row:1}}

/* Missão 5 — frasco lacrado e observações acumuladas */
.m-sealed{position:relative;margin:8px auto 16px;width:140px;height:140px;border-radius:28px;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 45% 40%,#563b87,#21152f 75%);border:2px solid #c39a5b;box-shadow:0 10px 35px #110b2a88;font-size:4rem}.m-sealed span{position:absolute;bottom:7px;right:18px;font-size:2rem;color:#ffe3a0;text-shadow:0 2px 4px #000}.m-history{display:grid;gap:10px;padding:8px 0}.m-history .barrow{min-width:0}.m-history .barrow span{min-width:64px}.m-history .barrow strong{min-width:48px;text-align:right}@media(max-width:380px){.m-history .barrow{gap:5px}.m-history .barrow span{font-size:.75rem}.m-history .barrow strong{font-size:.75rem}}

/* v0.5 — campanha e missão de síntese */
.campaign-panel{background:linear-gradient(145deg,#342247,#21192f);border:1px solid #9475a8;border-radius:17px;padding:16px;display:grid;gap:11px}.campaign-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px}.campaign-head strong{color:#f4d18c}.campaign-head span{font-size:.85rem}.campaign-panel p{margin:0;font-size:.87rem}.campaign-track{height:12px;border-radius:20px;background:#181021;overflow:hidden}.campaign-track>div{height:100%;background:linear-gradient(90deg,#c89752,#f4df91);border-radius:20px}.campaign-medals{display:flex;flex-wrap:wrap;gap:8px}.campaign-medals span{border:1px solid #9373a9;border-radius:30px;padding:5px 11px;font-weight:700}.campaign-done{border-color:#d2b16d}.campaign-score{font-size:.75rem;color:#f4d18c!important}.order-box{border:1px solid #7b5d90;border-radius:16px;padding:12px}.order-box h3{margin:0 0 8px}.order-box p{margin:0 0 12px}.master-options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.master-option{border:2px solid #73568c;border-radius:12px;background:#30233e;color:#f7ecf7;display:flex;flex-direction:column;gap:7px;align-items:center;justify-content:center;min-height:130px;padding:9px 5px;text-align:center;font-size:.85rem}.master-option[aria-pressed="true"]{border-color:#f1c66e;background:#584068}.master-option small{font-size:.72rem}.budget{padding:13px;border:1px solid #9e8d58;background:#302c27;border-radius:12px;text-align:center}.budget.over{border-color:#ff7788;color:#ffd1d6}.campaign-finale{padding:16px;text-align:center;border:1px solid #c6a46c;border-radius:15px;background:#392e37}.campaign-finale strong{color:#f5d68e;font-size:1.2rem}.campaign-finale p{margin:8px 0 0}@media(max-width:380px){.master-option{font-size:.72rem;min-height:120px}.master-option small{font-size:.66rem}.campaign-panel{padding:12px}}

.learn-row{display:grid;grid-template-columns:minmax(0,1fr) 85px 60px;gap:10px;align-items:center;border-bottom:1px solid #ffffff22;padding:11px 0;font-size:.88rem}.learn-row small{display:block;opacity:.7}.learn-meter{height:10px;background:#ffffff22;border-radius:30px;overflow:hidden}.learn-meter>div{height:100%;background:#c69d58}.learn-history{max-height:270px;overflow:auto}.learn-history>div{padding:9px 0;border-bottom:1px solid #ffffff22}.learn-history small{display:block;opacity:.65}.connection-pill{padding:9px 12px;border:1px solid #ffffff44;border-radius:10px;font-size:.85rem}.collective-bar{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.collective-bar button{flex:1}.teacher-table{width:100%;border-collapse:collapse;font-size:.85rem}.teacher-table th,.teacher-table td{padding:9px;border-bottom:1px solid #ffffff22;text-align:left}.teacher-table-wrap{overflow-x:auto}

/* v0.8.3 — identidade visível e estável, tanto no navegador quanto no HTML avulso. */
.identity-badge{max-width:min(40vw,220px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.77rem;border:1px solid #d7b16b;background:#49365a;color:#fff1bd;border-radius:99px;padding:7px 10px;min-height:38px;cursor:pointer}
.identity-badge:focus-visible,.identity-card input:focus-visible{outline:3px solid #95e6d4;outline-offset:2px}

.identity-card{width:min(95vw,510px);max-height:95vh;overflow:auto;display:grid;gap:12px;background:#2b203d;border:2px solid #dcb76c;border-radius:20px;padding:clamp(18px,4vw,28px);box-shadow:0 18px 70px #0009;color:#f9edfa}
.identity-card h2{margin:0;font-size:1.65rem;line-height:1.25}.identity-card p{margin:0}.identity-card label{font-weight:750}.identity-card input{background:#1b1429;border:1px solid #c0a2ce;border-radius:10px;padding:13px 12px;color:#fff;font:inherit;width:100%}
.identity-card small{color:#d5c4df}.identity-auto-preview{font-size:.87rem;color:#f1d69b}.identity-error{color:#ffc3c3;min-height:1em}.identity-actions{display:grid;grid-template-columns:1fr;gap:9px}.identity-actions button{width:100%;min-height:46px}

"use strict";
/* Motor único para duas retiradas, com/sem reposição. */
const ProbabilityCore=Object.freeze({
  pair(red,blue,replacement){const n=red+blue;if(!Number.isInteger(red)||!Number.isInteger(blue)||red<0||blue<0||n<2)return 0;return (red/n)*(replacement?red/n:(red-1)/(n-1));},
  branches(red,blue,replacement){const n=red+blue;return [
    {first:'V',second:'V',probability:(red/n)*((red-(replacement?0:1))/(n-(replacement?0:1)))},
    {first:'V',second:'A',probability:(red/n)*(blue/(n-(replacement?0:1)))},
    {first:'A',second:'V',probability:(blue/n)*(red/(n-(replacement?0:1)))},
    {first:'A',second:'A',probability:(blue/n)*((blue-(replacement?0:1))/(n-(replacement?0:1)))}
  ];},
  draw(red,blue,previous,replacement,rng){let r=red,b=blue;if(previous&&!replacement){if(previous==='red')r--;else b--;}return rng(r+b)<r?'red':'blue';}
});
function probabilityTree(red,blue,replacement){const n=red+blue,k=replacement?0:1;return `<section class="prob-tree"><h3>Árvore das duas retiradas</h3><p>Primeira retirada: <strong>V ${red}/${n}</strong> ou <strong>A ${blue}/${n}</strong>.</p><div class="tree-branches"><div>🔴 V (${red}/${n})<div class="branch">↳ 🔴 V: ${red-k}/${n-k}<br>↳ 🔵 A: ${blue}/${n-k}</div></div><div>🔵 A (${blue}/${n})<div class="branch">↳ 🔴 V: ${red}/${n-k}<br>↳ 🔵 A: ${blue-k}/${n-k}</div></div></div><p><strong>P(VV) = ${red}/${n} × ${red-k}/${n-k} = ${(100*ProbabilityCore.pair(red,blue,replacement)).toFixed(2).replace('.',',')}%</strong></p><small>${replacement?'A gota volta; a composição não muda.':'A gota não volta; a segunda probabilidade depende da primeira.'}</small></section>`;}

</script><script>

 return {student,alias:makeAutoAlias(student),confirmed:false,mode:'auto'};
}
function storeProfile(){const profiles=readProfiles();profiles[profileRoom(collective.room)]={student:collective.student,alias:collective.alias,confirmed:collective.confirmed,mode:collective.mode};return localWrite(PROFILE_KEY,JSON.stringify(profiles));}
function readQueue(){try{const q=JSON.parse(localRead(QUEUE_KEY)||'[]');return Array.isArray(q)?q:[]}catch{return []}}
function writeQueue(q){if(!localWrite(QUEUE_KEY,JSON.stringify(q))){syncState='Armazenamento cheio: exporte seu diário';return false;}return true;}
let syncState='';
const requestedRoom=new URLSearchParams(location.search).get('sala');
const room=requestedRoom||localRead(ROOM_KEY)||(typeof sessionStorage!=='undefined'?sessionStorage.getItem('pocoes-sala-v07'):'')||'';
const p=initialProfile(room);
const collective={room,student:p.student,alias:p.alias,confirmed:p.confirmed,mode:p.mode,busy:false,profileBusy:false,profileDirty:true};
if(collective.room){localWrite(ROOM_KEY,collective.room);try{sessionStorage.setItem('pocoes-sala-v07',collective.room)}catch{}}
// Legacy queue did not store student per event; attach the original device identity at migration.
try{const old=JSON.parse(localRead(OLD_QUEUE_KEY)||'[]');if(Array.isArray(old)&&old.length){const merged=readQueue(),legacy=getLegacyStudentId();for(const row of old){if(!merged.some(x=>x.id===row.id))merged.push({...row,room:row.room||collective.room,student:row.student||legacy});}if(writeQueue(merged))localStorage.removeItem(OLD_QUEUE_KEY);}}catch{}
function identityLabel(){return collective.alias||makeAutoAlias(collective.student)}
function identityBadge(){const b=document.getElementById('identity-badge');if(!b)return;b.textContent='🧪 '+identityLabel();b.title='Consultar ou alterar meu identificador';b.setAttribute('aria-label','Meu identificador: '+identityLabel()+'. Alterar identificação');}
function identityModal(open){const modal=document.getElementById('identity-modal');if(!modal)return;modal.hidden=!open;if(open){const input=document.getElementById('identity-name');input.value=collective.confirmed&&collective.mode==='custom'?collective.alias:'';document.getElementById('identity-code').textContent='Identificador automático disponível: '+makeAutoAlias(collective.student);document.getElementById('identity-cancel').hidden=!collective.confirmed;document.getElementById('identity-error').textContent='';input.focus();}else{identityBadge();document.getElementById('identity-badge')?.focus();}}
function normalizeAlias(value){const s=String(value).normalize('NFC').trim().replace(/\s+/g,' ');if(!s||s.length>32||/[\u0000-\u001f\u007f<>]/.test(s))return null;return /^\d{1,3}$/.test(s)?'Nº '+s:s;}
function setIdentity(value,mode){const alias=mode==='auto'?makeAutoAlias(collective.student):normalizeAlias(value);if(!alias){document.getElementById('identity-error').textContent='Use 1 a 32 caracteres: um pseudônimo ou número de chamada, sem símbolos HTML.';return false;}
 const before={alias:collective.alias,mode:collective.mode,confirmed:collective.confirmed};collective.alias=alias;collective.mode=mode;collective.confirmed=true;
 if(!storeProfile()){Object.assign(collective,before);document.getElementById('identity-error').textContent='Não foi possível guardar a identificação neste navegador.';return false;}
 collective.profileDirty=true;identityModal(false);identityBadge();collectiveRegister();return true;
}
function identityInit(){const badge=document.getElementById('identity-badge');if(badge)badge.addEventListener('click',()=>identityModal(true));document.getElementById('identity-accept')?.addEventListener('click',()=>setIdentity(document.getElementById('identity-name').value,'custom'));document.getElementById('identity-auto')?.addEventListener('click',()=>setIdentity('', 'auto'));document.getElementById('identity-cancel')?.addEventListener('click',()=>identityModal(false));document.getElementById('identity-name')?.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();setIdentity(e.currentTarget.value,'custom');}});identityBadge();if(collective.room&&!collective.confirmed)identityModal(true);else if(collective.room)collectiveRegister();}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',identityInit);else identityInit();
async function collectiveRegister(){if(!collective.room||!collective.confirmed||collective.profileBusy||!collective.profileDirty||!/^https?:$/.test(location.protocol))return;
 collective.profileBusy=true;const alias=collective.alias,student=collective.student,room=collective.room;
 try{const res=await fetch('/api/student-profile',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({room,student,alias})});if(!res.ok){syncState='Identificação ainda não registrada no servidor';return;}if(alias===collective.alias&&student===collective.student&&room===collective.room)collective.profileDirty=false;}
 catch{syncState='Sem conexão: identificação pendente';}
 finally{collective.profileBusy=false;}
}
function collectiveSend(row){if(!collective.room)return;const q=readQueue();if(!q.some(x=>x.id===row.id)){q.push({...row,room:collective.room,student:collective.student,alias:collective.alias});if(!writeQueue(q))return;}collectiveSync();}
async function collectiveSync(){
 if(collective.busy||!/^https?:$/.test(location.protocol))return;
 if(collective.profileDirty&&!collective.profileBusy)await collectiveRegister();
 const q=readQueue();if(!q.length){if(collective.room)syncState=collective.profileDirty?'Identificação pendente':'Todos os registros enviados';return;}
 collective.busy=true;
 try{const first=q.find(x=>(x.room||collective.room)===collective.room&&(x.student||getLegacyStudentId())===collective.student)||q.find(x=>(x.room||collective.room)===collective.room);
  if(!first){syncState='Há registros de outra turma preservados; entre naquela sala para enviá-los';return;}
  const sendingRoom=first.room||collective.room,student=first.student||getLegacyStudentId();
  if(!sendingRoom){syncState='Registros antigos sem sala: exporte seu diário';return;}
  const batch=q.filter(x=>(x.room||collective.room)===sendingRoom&&(x.student||getLegacyStudentId())===student).slice(0,50);
  const alias=sendingRoom===collective.room&&student===collective.student?collective.alias:(batch.at(-1)?.alias||'');
  const events=batch.map(({room,student,alias,...event})=>event);
  const res=await fetch('/api/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({room:sendingRoom,student,alias,events})});
  if(!res.ok){let error='HTTP '+res.status;try{const d=await res.json();error=typeof d.detail==='string'?d.detail:error;}catch{}syncState=res.status===403?'Sala não reconhecida: procure o professor; dados preservados':`Servidor recusou envio (${error}); dados preservados`;return;}
  const sent=new Set(batch.map(x=>x.id));writeQueue(readQueue().filter(x=>!sent.has(x.id)));
  syncState=readQueue().length?'Enviando registros pendentes':'Todos os registros enviados';
 }catch{syncState='Sem conexão: registros aguardam sincronização';}
 finally{collective.busy=false;}
}
function collectiveHubControls(){const host=document.querySelector('.campaign-panel');if(!host)return;const el=document.createElement('div');el.className='connection-pill';el.setAttribute('role','status');el.textContent=collective.room?`📡 Sala ${collective.room} · ${identityLabel()} · ${readQueue().length} pendente(s). ${syncState}`:`📱 ${identityLabel()} · modo individual offline`;host.after(el);
 if(collective.room){const b=document.createElement('button');b.className='secondary';b.textContent='Sincronizar resultados';b.onclick=async()=>{await collectiveSync();el.textContent=`📡 Sala ${collective.room} · ${identityLabel()} · ${readQueue().length} pendente(s). ${syncState}`;};el.after(b);}}
if(/^https?:$/.test(location.protocol))setInterval(collectiveSync,8000);

</script></body></html>
